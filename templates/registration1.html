<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>     
    * {
        margin: 0;         
        padding: 0;         
        box-sizing: border-box;     
    }
    body {         
        font-family: Arial, sans-serif;        
        background-color: #ffff;     
    }      
    h2 {         
        text-align: center;         
        color: #302b63;         
        margin-top: 40px;         
        margin-bottom: 25px;    
    }      
    form {         
        width: 400px;         
        margin: auto;         
        background-color: white;         
        padding: 30px;         
        border-radius: 10px;         
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);     
    }      
    label {         
        color: #302b63;         
        font-weight: bold;     
    }      
    input[type="text"],    
    input[type="password"] {         
        width: 100%;         
        padding: 10px;         
        margin-top: 8px;         
        border: 1px solid #ccc;         
        border-radius: 5px;    
    }      
    input[type="text"]:focus,     
    input[type="password"]:focus {         
        border-color: #8e44ad;         
        outline: none;     
    }      
    input[type="submit"],     
    input[type="reset"] {         
        padding: 10px 20px;         
        border: none;         
        border-radius: 5px;         
        color: white;         
        cursor: pointer;     
    }      
    input[type="submit"] {         
        background-color: #8e44ad;     
    }      
    input[type="reset"] {         
        background-color: #302b63;         
        margin-left: 10px;     
    }      
    input[type="submit"]:hover {         
        background-color: #691c8a;     
    }      
    input[type="reset"]:hover {         
        background-color: #201c4a;     
    }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family:arial,sans-serif;
            background-color: #f4f7fc;
        }
        /*navbar*/
        .navbar{
            background-color: rgb(208, 16, 106);
            padding: 20px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo{
            color: #1b1b19;
            font-size: 22px;
            font-weight: bold;
        }
        /*navigation*/
        .nav-links{
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }
        .nav-links a:hover{
            color: aqua;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        .nav-links a:hover{
            color: #00bcd4;
        }    
        }
        /*login.btn*/
        .login-btn{
            background-color:  #e5b7e5;
            padding: 5px 10px;
            border-radius:5px;
        }
        .login-btn:hover{
            background-color: #00bcd4;
            color:white !important;
         }
        /*register button*/
        .register-btn{
            background-color: #e5b7e5;;
            padding:5px 10px;
            border-radius: 5px;
        } 
        .register-btn:hover{
            background-color: #0097a7;
            color:white !important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align: center;
        } 
    </style> 
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            Employee Management System
        </div>
        <ul class="nav-links">
         <li>
            <a href="/home">
              Home
            </a>
         </li>
          <li>
            <a href="/employees">
              Employee
            </a>
        </li>
         <li>
            <a href="/add-employee">
              Addemployee
            </a>
         </li>
          <li>
            <a href="/search">
              Search
            </a>
         </li>
          <li>
            <a href="/registration1">
              <button class="register-btn" type="submit">Register</button>
            </a>
         </li>
         <li>
            <a href="/login">
              <button class="login-btn" type="submit">Login</button>
            </a>
         </li>

        </ul>
    </nav>
    <h2>Registrationform</h2>
     <form id="registrationform" action="/registration1" method="post">
    
    <label>fullname</label>
    <input id="fullname" name="fullname" type="text"><br><br>
    <label>username</label>
    <input id="username" name="username" type="text"><br><br>
    <label>password</label>
    <input id="password" name="password" type="password"><br><br>
    <button type="submit" value="register">Register</button>
    <button type="reset" value="reset">Login</button>
    </form>
</body>
</html>
