<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family:arial,sans-serif;
            background-color: #f4f7fc;
        }
        /*navbar*/
        .navbar{
            background-color: rgb(208, 16, 106);
            padding: 20px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo{
            color: #1b1b19;
            font-size: 22px;
            font-weight: bold;
        }
        /*navigation*/
        .nav-links{
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }
        .nav-links a:hover{
            color: aqua;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        .nav-links a:hover{
            color: #00bcd4;
        }    
        }
        /*login.btn*/
        .login-btn{
            background-color:  #e5b7e5;
            padding: 5px 10px;
            border-radius:5px;
        }
        .login-btn:hover{
            background-color: #00bcd4;
            color:white !important;
         }
        /*register button*/
        .register-btn{
            background-color: #e5b7e5;;
            padding:5px 10px;
            border-radius: 5px;
        } 
        .register-btn:hover{
            background-color: #0097a7;
            color:white !important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align: center;
        }
        .theme-buttons {
            display:flex;
            gap: 10px;
            margin-top:10px;
    }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            Employee Management System
        </div>
        <ul class="nav-links">
         <li>
            <a href="/home">
              Home
            </a>
         </li>
          <li>
            <a href="/employees">
              Employee
            </a>
        </li>
         <li>
            <a href="/add-employee">
              Addemployee
            </a>
         </li>
          <li>
            <a href="/search">
              Search
            </a>
         </li>
          <li>
            <a href="/registration1">
              <button class="register-btn" type="submit">Register</button>
            </a>
         </li>
         <li>
            <a href="/login">
              <button class="login-btn" type="submit">Login</button>
            </a>
         </li>

        </ul>
    </nav>
    <div class="content">
        <h1> Welcome to Employee Management System</h1>
        <p>Manage your Employee Easely</p>
    </div>
</body>
</html>
